name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/backend.yml"
      - "compose.yaml"
      - "Dockerfile"
      - "README.md"
  pull_request:
    paths:
      - "backend/**"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/backend.yml"
      - "compose.yaml"
      - "Dockerfile"
      - "README.md"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sherlock_test
          POSTGRES_PASSWORD: sherlock
          POSTGRES_USER: sherlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sherlock -d sherlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sherlock:sherlock@localhost:5432/sherlock_test
      TEST_DATABASE_URL: postgresql+psycopg://sherlock:sherlock@localhost:5432/sherlock_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file ../.env.example -f ../compose.yaml config --quiet
      - run: docker build --target runtime -t sherlock-backend:ci ..
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.8"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
