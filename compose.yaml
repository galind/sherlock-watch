name: sherlock

x-runtime-build: &runtime-build
  context: .
  target: runtime

x-development-build: &development-build
  context: .
  target: development

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sherlock}:${POSTGRES_PASSWORD:-sherlock}@db:5432/${POSTGRES_DB:-sherlock}
  VINTED_BASE_URL: ${VINTED_BASE_URL:-https://www.vinted.es}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-3600}
  WATCH_PAGES: ${WATCH_PAGES:-3}
  WATCH_PER_PAGE: ${WATCH_PER_PAGE:-48}
  WATCH_WATCHES_ONLY: ${WATCH_WATCHES_ONLY:-true}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherlock}
      POSTGRES_USER: ${POSTGRES_USER:-sherlock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    profiles: [tools]
    build: *development-build
    image: sherlock-backend:development
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    init: true

  migrate:
    build: *runtime-build
    image: sherlock-backend:runtime
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [alembic]
    command: [upgrade, head]
    restart: "no"

  watcher:
    build: *runtime-build
    image: sherlock-backend:runtime
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [watch-vinted, --queries-file, /app/queries.txt]
    volumes:
      - ./queries.txt:/app/queries.txt:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - sherlock
        - watcher-health
        - --heartbeat-file
        - /tmp/sherlock-watcher-heartbeat.json
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

  test-db:
    profiles: [test]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sherlock_test
      POSTGRES_PASSWORD: sherlock
      POSTGRES_USER: sherlock
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sherlock -d sherlock_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  test:
    profiles: [test]
    build: *development-build
    image: sherlock-backend:development
    environment:
      DATABASE_URL: postgresql+psycopg://sherlock:sherlock@test-db:5432/sherlock_test
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
      TEST_DATABASE_URL: postgresql+psycopg://sherlock:sherlock@test-db:5432/sherlock_test
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: [pytest]
    command: []

volumes:
  postgres-data:
